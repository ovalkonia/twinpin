<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    .ticket { max-width: 600px; margin: 0 auto; background: white; border-radius: 10px; padding: 30px; border: 2px solid #ff6b00; }
    .header { text-align: center; margin-bottom: 30px; }
    .ticket-number { font-size: 24px; color: #ff6b00; font-weight: bold; text-align: center; padding: 20px; background: #fafafa; border-radius: 8px; margin: 20px 0; }
    .details { margin: 20px 0; line-height: 1.8; }
    .footer { text-align: center; margin-top: 30px; color: #666; font-size: 14px; }
    .button { display: inline-block; padding: 12px 30px; background: #ff6b00; color: white; text-decoration: none; border-radius: 5px; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="ticket">
    <div class="header">
      <h1>🎫 Your Ticket</h1>
    </div>
    
    <div class="ticket-number">
      {{ticketNumber}}
    </div>
    
    <div class="details">
      <p><strong>Event:</strong> {{eventTitle}}</p>
      <p><strong>Date:</strong> {{eventDate}}</p>
      <p><strong>Location:</strong> {{eventLocation}}</p>
      <p><strong>Name:</strong> {{userName}}</p>
      <p><strong>Email:</strong> {{userEmail}}</p>
    </div>
    
    <div style="text-align: center;">
      <a href="#" class="button">Add to Calendar</a>
    </div>
    
    <div class="footer">
      <p>Show this email at the entrance.</p>
      <p>© 2026 EventPlatform</p>
    </div>
  </div>
</body>
</html>
